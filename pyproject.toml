[project]
name = "metabench"
version = "0.1.0"
description = "Open-ended benchmark of ML and hybrid models vs FBA-family methods against held-out experimental data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cobra>=0.29",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "typer>=0.12",
    "xlrd>=2.0",
]

[project.scripts]
metabench = "metabench.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["metabench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs downloaded genome-scale models or other large data"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"metabench/cli.py" = ["B008"]  # typer.Option defaults are the typer idiom

[tool.mypy]
python_version = "3.12"  # numpy stubs in the lock use 3.12 syntax
strict_optional = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["tests/"]
